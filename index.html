<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>1895 文化身份測驗</title>


  <style>

    /* ========================================
       基本設定
    ======================================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        "Noto Serif TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      background: #102942;

      color: #34281e;

    }

    button {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }


    /* ========================================
       APP 主容器
    ======================================== */

    .app {

      width: 100%;

      max-width: 620px;

      min-height: 100vh;

      margin: 0 auto;

      background: #f3e5ca;

      overflow: hidden;

      position: relative;

      box-shadow:
        0 0 35px
        rgba(0, 0, 0, 0.35);

    }


    /* ========================================
       開始頁
    ======================================== */

    #startScreen {

      width: 100%;

      min-height: 100vh;

      background: #102942;

    }

    .start-image-wrapper {

      position: relative;

      width: 100%;

    }

    .start-image {

      display: block;

      width: 100%;

      height: auto;

    }


    /*
      透明按鈕

      疊在你的封面圖片
      「開始測驗」的位置。
    */

    .start-click-area {

      position: absolute;

      left: 18%;

      width: 64%;

      bottom: 4.2%;

      height: 7%;

      border: none;

      border-radius: 100px;

      background: transparent;

      cursor: pointer;

      z-index: 10;

    }

    .start-click-area:hover {

      background:
        rgba(255, 255, 255, 0.07);

    }


    /* ========================================
       測驗頁
    ======================================== */

    #quizScreen {

      min-height: 100vh;

      padding-bottom: 50px;

      background:
        linear-gradient(
          180deg,
          #132d49 0,
          #132d49 220px,
          #f3e5ca 220px,
          #f3e5ca 100%
        );

    }


    /* 標題 */

    .quiz-header {

      padding:
        28px
        20px
        14px;

      text-align: center;

      color: #fff2d5;

    }

    .quiz-year {

      margin-bottom: 7px;

      font-size: 28px;

      letter-spacing: 5px;

    }

    .quiz-name {

      font-size: 26px;

      font-weight: bold;

      letter-spacing: 4px;

    }


    /* ========================================
       進度條
    ======================================== */

    .progress-section {

      padding:
        15px
        28px
        15px;

    }

    .progress-text {

      margin-bottom: 12px;

      color: #f8e7c6;

      text-align: center;

      font-size: 14px;

    }

    .progress-track {

      width: 100%;

      height: 9px;

      background:
        rgba(255, 255, 255, 0.25);

      border-radius: 20px;

      overflow: hidden;

    }

    .progress-bar {

      width: 0;

      height: 100%;

      background: #ae4b34;

      border-radius: 20px;

      transition: width 0.3s ease;

    }


    /* ========================================
       問題卡
    ======================================== */

    .question-card {

      position: relative;

      margin:
        28px
        20px;

      padding:
        31px
        22px
        24px;

      background: #fff8e9;

      border:
        2px solid
        #d3b685;

      border-radius: 23px;

      box-shadow:
        0 8px 24px
        rgba(67, 41, 19, 0.14);

    }

    .question-card::before {

      content: "✿";

      position: absolute;

      top: -19px;

      left: 50%;

      transform:
        translateX(-50%);

      display: flex;

      justify-content: center;

      align-items: center;

      width: 38px;

      height: 38px;

      border-radius: 50%;

      background: #a74330;

      color: #f6e1b6;

      font-size: 20px;

    }


    /* 題目 */

    .question {

      margin:
        5px
        0
        26px;

      color: #17314d;

      text-align: center;

      font-size: 21px;

      font-weight: bold;

      line-height: 1.65;

    }


    /* ========================================
       選項
    ======================================== */

    .option {

      display: flex;

      align-items: flex-start;

      gap: 13px;

      width: 100%;

      margin:
        12px
        0;

      padding: 15px;

      border:
        1.5px solid
        #d2b487;

      border-radius: 14px;

      background: #fffdf6;

      color: #413124;

      font-size: 16px;

      line-height: 1.65;

      text-align: left;

      cursor: pointer;

      transition: 0.18s ease;

    }

    .option:hover {

      background: #f6e6c8;

      border-color: #a34732;

      transform:
        translateY(-2px);

    }

    .option:active {

      transform:
        scale(0.99);

    }

    .option-letter {

      flex-shrink: 0;

      display: flex;

      justify-content: center;

      align-items: center;

      width: 32px;

      height: 32px;

      border-radius: 50%;

      background: #17334f;

      color: #fff4db;

      font-weight: bold;

    }


    /* ========================================
       結果頁
    ======================================== */

    #resultScreen {

      width: 100%;

      min-height: 100vh;

      padding-bottom: 30px;

      background: #102942;

    }

    .result-wrapper {

      position: relative;

      width: 100%;

    }

    .result-image {

      display: block;

      width: 100%;

      height: auto;

    }


    /* ========================================
       圖片上的透明分享按鈕
    ======================================== */

    .share-click-area {

      position: absolute;

      left: 16%;

      width: 68%;

      bottom: 5.5%;

      height: 6%;

      border: none;

      border-radius: 100px;

      background: transparent;

      cursor: pointer;

      z-index: 10;

    }

    .share-click-area:hover {

      background:
        rgba(255, 255, 255, 0.07);

    }


    /* ========================================
       圖片上的再測一次
    ======================================== */

    .retry-click-area {

      position: absolute;

      left: 29%;

      width: 42%;

      bottom: 1%;

      height: 4%;

      border: none;

      border-radius: 100px;

      background: transparent;

      cursor: pointer;

      z-index: 10;

    }


    /* ========================================
       分享提示
    ======================================== */

    .share-guide {

      margin:
        20px
        18px
        5px;

      padding:
        18px;

      border:
        1px solid
        #d6b77f;

      border-radius: 15px;

      background: #f5e6ca;

      color: #4e3929;

      text-align: center;

      line-height: 1.8;

      font-size: 14px;

    }

    .share-guide strong {

      color: #9f3f2e;

    }


    /* ========================================
       結果頁實體按鈕
    ======================================== */

    .result-actions {

      display: flex;

      flex-direction: column;

      gap: 12px;

      padding:
        18px
        20px
        5px;

    }

    .result-button {

      width: 100%;

      padding:
        15px
        20px;

      border-radius: 50px;

      font-size: 17px;

      font-weight: bold;

      letter-spacing: 1px;

      cursor: pointer;

      transition: 0.2s;

    }


    /* 分享 */

    .share-button {

      border:
        2px solid
        #ead2a6;

      background: #a74431;

      color: #fff5de;

    }

    .share-button:hover {

      background: #8d3628;

    }


    /* 複製網址 */

    .copy-button {

      border:
        2px solid
        #d3b687;

      background: #f3e2c3;

      color: #17314d;

    }

    .copy-button:hover {

      background: #e7cfaa;

    }


    /* 再測 */

    .retry-button {

      border:
        2px solid
        #d5b57e;

      background: #17314d;

      color: #fff5de;

    }

    .retry-button:hover {

      background: #234764;

    }


    /* ========================================
       Toast 提示
    ======================================== */

    .toast {

      position: fixed;

      left: 50%;

      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(30px);

      width:
        calc(100% - 40px);

      max-width: 500px;

      padding:
        14px
        18px;

      border-radius: 15px;

      background:
        rgba(20, 43, 70, 0.96);

      color: #fff4dc;

      text-align: center;

      line-height: 1.6;

      font-size: 14px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.25s,
        transform 0.25s;

      z-index: 999;

    }

    .toast.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);

    }


    /* ========================================
       找不到圖片
    ======================================== */

    .image-error {

      min-height: 100vh;

      padding:
        90px
        25px;

      background: #f3e5ca;

      text-align: center;

    }

    .image-error h2 {

      color: #17314d;

      font-size: 30px;

    }

    .image-error p {

      line-height: 1.8;

    }

    .normal-button {

      margin-top: 20px;

      padding:
        14px
        30px;

      border: none;

      border-radius: 50px;

      background: #17314d;

      color: #fff4dc;

      font-size: 17px;

      cursor: pointer;

    }


    /* ========================================
       手機版
    ======================================== */

    @media (max-width: 620px) {

      .app {

        max-width: none;

        box-shadow: none;

      }

      .question-card {

        margin:
          27px
          14px;

        padding:
          28px
          16px
          22px;

      }

      .question {

        font-size: 19px;

      }

      .option {

        font-size: 15px;

      }

      .quiz-year {

        font-size: 25px;

      }

      .quiz-name {

        font-size: 23px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ========================================
       開始頁
  ========================================= -->

  <section id="startScreen">


    <div class="start-image-wrapper">


      <img
        src="./images/start-cover.png"
        class="start-image"
        alt="1895文化身份測驗開始畫面"
      >


      <button
        class="start-click-area"
        onclick="startQuiz()"
        aria-label="開始測驗"
      ></button>


    </div>


  </section>



  <!-- ========================================
       測驗頁
  ========================================= -->

  <section
    id="quizScreen"
    class="hidden"
  >


    <header class="quiz-header">


      <div class="quiz-year">
        ✿ 1895 ✿
      </div>


      <div class="quiz-name">
        文化身份測驗
      </div>


    </header>



    <div class="progress-section">


      <div
        id="progressText"
        class="progress-text"
      ></div>


      <div class="progress-track">


        <div
          id="progressBar"
          class="progress-bar"
        ></div>


      </div>


    </div>



    <main class="question-card">


      <div
        id="question"
        class="question"
      ></div>


      <div id="options"></div>


    </main>


  </section>



  <!-- ========================================
       結果頁
  ========================================= -->

  <section
    id="resultScreen"
    class="hidden"
  >


    <div
      id="resultWrapper"
      class="result-wrapper"
    >


      <img
        id="resultImage"
        class="result-image"
        src=""
        alt="1895文化身份測驗結果"
      >


      <!-- 圖片中的分享區域 -->

      <button
        class="share-click-area"
        onclick="shareResult()"
        aria-label="分享測驗結果"
      ></button>


      <!-- 圖片中的再測一次 -->

      <button
        class="retry-click-area"
        onclick="restartQuiz()"
        aria-label="再測一次"
      ></button>


    </div>



    <!-- 分享說明 -->

    <div
      id="shareGuide"
      class="share-guide"
    >

      <strong>
        分享到 IG：
      </strong>

      按下分享後，系統會把你的結果圖片送到手機分享選單，
      同時自動複製測驗網址。

      <br>

      在 Instagram 限時動態中加入
      「連結」貼紙，再貼上網址，
      朋友就能直接進入測驗。

    </div>



    <!-- 實體按鈕 -->

    <div
      id="resultActions"
      class="result-actions"
    >


      <button
        class="result-button share-button"
        onclick="shareResult()"
      >
        分享我的測驗結果
      </button>


      <button
        class="result-button copy-button"
        onclick="copyQuizLink()"
      >
        複製測驗網站連結
      </button>


      <button
        class="result-button retry-button"
        onclick="restartQuiz()"
      >
        ↻ 再測一次
      </button>


    </div>



    <!-- 找不到圖片 -->

    <div
      id="imageError"
      class="image-error hidden"
    >


      <h2 id="errorCharacter"></h2>


      <p>

        找不到這個人物的結果圖片。

        <br>

        請確認圖片已經放進
        <strong>images</strong>
        資料夾，

        <br>

        且圖片名稱與程式完全一致。

      </p>


      <button
        class="normal-button"
        onclick="restartQuiz()"
      >
        再測一次
      </button>


    </div>


  </section>


</div>



<!-- Toast -->

<div
  id="toast"
  class="toast"
></div>



<script>


/* ========================================
   自動取得測驗網站網址
======================================== */

/*
  假設網站是：

  https://abc.github.io/1895-quiz/

  這裡會自動得到：

  https://abc.github.io/1895-quiz/

  所以不需要手動修改 GitHub 網址。
*/

const QUIZ_URL =
  new URL(
    "./",
    window.location.href
  ).href;



/* ========================================
   八位人物
======================================== */

const characters = {


  "胡嘉猷": {

    title:
      "地方號召者",

    image:
      "./images/hu-jia-you.png"

  },


  "江國輝": {

    title:
      "守城隊長",

    image:
      "./images/jiang-guo-hui.png"

  },


  "吳湯興": {

    title:
      "可靠統領",

    image:
      "./images/wu-tang-xing.png"

  },


  "徐驤": {

    title:
      "不屈行動派",

    image:
      "./images/xu-xiang.png"

  },


  "姜紹祖": {

    title:
      "熱血理想派",

    image:
      "./images/jiang-shao-zu.png"

  },


  "丘逢甲": {

    title:
      "理想策士",

    image:
      "./images/qiu-feng-jia.png"

  },


  "劉永福": {

    title:
      "老練戰略家",

    image:
      "./images/liu-yong-fu.png"

  },


  "邱鳳揚": {

    title:
      "社群守護者",

    image:
      "./images/qiu-feng-yang.png"

  }

};



/* ========================================
   八題
======================================== */

const questions = [


  /* ---------- 第 1 題 ---------- */

  {

    question:
      "當你的團隊突然遇到重大危機，你第一個反應會是？",

    options: [

      {

        text:
          "先把大家集合起來，確認每個人能做什麼，再一起行動。",

        character:
          "胡嘉猷"

      },


      {

        text:
          "馬上觀察環境，找到最有機會突破的地方直接行動。",

        character:
          "徐驤"

      },


      {

        text:
          "先冷靜評估手上的資源、勝算和可能的後果。",

        character:
          "劉永福"

      },


      {

        text:
          "即使成功機率不高，只要覺得這件事是對的，我還是會站出來。",

        character:
          "姜紹祖"

      }

    ]

  },



  /* ---------- 第 2 題 ---------- */

  {

    question:
      "如果大家意見嚴重分歧，你比較可能怎麼做？",

    options: [

      {

        text:
          "建立明確規則和分工，先讓團隊恢復秩序。",

        character:
          "江國輝"

      },


      {

        text:
          "找出大家共同相信的目標，用理念重新凝聚大家。",

        character:
          "丘逢甲"

      },


      {

        text:
          "花時間協調不同意見，讓大部分人都願意一起走下去。",

        character:
          "胡嘉猷"

      },


      {

        text:
          "如果討論一直僵持，我會做出決定，帶著大家先採取行動。",

        character:
          "江國輝"

      }

    ]

  },



  /* ---------- 第 3 題 ---------- */

  {

    question:
      "老師突然要你負責一個困難的大型活動，你最可能成為哪種人？",

    options: [

      {

        text:
          "總召型：分配工作、追進度，確保每個環節都有人負責。",

        character:
          "吳湯興"

      },


      {

        text:
          "軍師型：分析整體局勢，思考怎樣做最有效率。",

        character:
          "劉永福"

      },


      {

        text:
          "氣氛核心型：照顧每個人的狀況，讓團隊不要散掉。",

        character:
          "邱鳳揚"

      },


      {

        text:
          "創意突破型：遇到問題就換方法，不會死守原本計畫。",

        character:
          "徐驤"

      }

    ]

  },



  /* ---------- 第 4 題 ---------- */

  {

    question:
      "如果你發現自己支持的事情可能會失敗，你會？",

    options: [

      {

        text:
          "只要這件事值得，就算結果不好，我還是想堅持到底。",

        character:
          "姜紹祖"

      },


      {

        text:
          "重新分析局勢，如果原本的方法不可行，就改變策略。",

        character:
          "劉永福"

      },


      {

        text:
          "想辦法號召更多人，讓大家相信同一個目標。",

        character:
          "丘逢甲"

      },


      {

        text:
          "先保護身邊的人和團隊，確定大家能一起撐過危機。",

        character:
          "邱鳳揚"

      }

    ]

  },



  /* ---------- 第 5 題 ---------- */

  {

    question:
      "以下哪一句話最接近你的想法？",

    options: [

      {

        text:
          "既然大家把事情交給我，我就有責任做到最後。",

        character:
          "吳湯興"

      },


      {

        text:

        character:

      },


      {

        text:
          "比起我自己出風頭，我更希望大家都能平安。",

        character:
          "邱鳳揚"

      },


      {

        text:
          "真正重要的是看清整個局勢，而不是只憑一時衝動。",

        character:
          "劉永福"

      }

    ]

  },



  /* ---------- 第 6 題 ---------- */

  {

    question:
      "當你看到一件你認為不公平的事情，你最可能？",

    options: [

      {

        text:
          "很快站出來表態，即使可能因此吃虧。",

        character:
          "姜紹祖"

      },


      {

        text:
          "思考怎麼把理念說清楚，讓更多人願意支持。",

        character:

      },


      {

        text:

        character:

      },


      {

        text:
          "先判斷現在直接對抗是不是最好的方法，再決定怎麼出手。",

        character:
          "江國輝"

      }

    ]

  },



  /* ---------- 第 7 題 ---------- */

  {

    question:
      "如果你是隊長，你最希望隊友怎麼形容你？",

    options: [

      {

        text:
          "他很可靠，有他在我們知道自己該做什麼。",

        character:
          "吳湯興"

      },


      {

        text:
          "他超難被打倒，遇到什麼狀況都有辦法繼續。",

        character:
          "徐驤"

      },


      {

        text:
          "他真的很敢，認為對的事情就會全力去做。",

        character:
          "姜紹祖"

      },


      {

        text:
          "他很會看大局，常常想到我們沒有注意到的事情。",

        character:
          "丘逢甲"

      }

    ]

  },



  /* ---------- 第 8 題 ---------- */

  {

    question:
      "假設你的家鄉遇到前所未有的危機，你最想扮演哪個角色？",

    options: [

      {

        text:
          "把地方上的人組織起來，募集資源、安排人手。",

        character:
          "胡嘉猷"

      },


      {

        text:
          "維持地方秩序，同時準備面對外來威脅。",

        character:
          "江國輝"

      },


      {

        text:
          "整合不同力量，成為能讓大家依靠的領導者。",

        character:
          "吳湯興"

      },


      {

        text:
          "留在大家身邊，守住家園和共同生活的地方。",

        character:
          "邱鳳揚"

      }

    ]

  }

];



/* ========================================
   測驗狀態
======================================== */

let currentQuestion = 0;

let scores = {};

let finalCharacter = "";

let toastTimer = null;



/* ========================================
   初始化分數
======================================== */

function resetScores() {

  scores = {};

  Object
    .keys(characters)
    .forEach(character => {

      scores[character] = 0;

    });

}



/* ========================================
   開始
======================================== */

function startQuiz() {


  resetScores();


  currentQuestion = 0;


  finalCharacter = "";


  document
    .getElementById("startScreen")
    .classList
    .add("hidden");


  document
    .getElementById("resultScreen")
    .classList
    .add("hidden");


  document
    .getElementById("quizScreen")
    .classList
    .remove("hidden");


  showQuestion();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/* ========================================
   顯示問題
======================================== */

function showQuestion() {


  const data =
    questions[currentQuestion];


  document
    .getElementById(
      "progressText"
    )
    .textContent =
      `第 ${currentQuestion + 1} 題 ／ 共 ${questions.length} 題`;



  const progress =
    (
      (currentQuestion + 1)
      /
      questions.length
    )
    * 100;


  document
    .getElementById(
      "progressBar"
    )
    .style
    .width =
      progress + "%";



  document
    .getElementById(
      "question"
    )
    .textContent =
      data.question;



  const optionsBox =
    document
      .getElementById(
        "options"
      );


  optionsBox.innerHTML =
    "";



  data.options.forEach(
    (option, index) => {


      const button =
        document
          .createElement(
            "button"
          );


      button.className =
        "option";



      const letter =
        document
          .createElement(
            "span"
          );


      letter.className =
        "option-letter";


      letter.textContent =
        String.fromCharCode(
          65 + index
        );



      const text =
        document
          .createElement(
            "span"
          );


      text.textContent =
        option.text;



      button.appendChild(
        letter
      );


      button.appendChild(
        text
      );



      button.addEventListener(
        "click",
        function () {

          selectAnswer(
            option.character
          );

        }
      );


      optionsBox.appendChild(
        button
      );

    }
  );

}



/* ========================================
   選答案
======================================== */

function selectAnswer(character) {


  scores[character] += 1;


  currentQuestion += 1;


  if (
    currentQuestion
    <
    questions.length
  ) {


    showQuestion();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


  }

  else {


    calculateResult();


  }

}



/* ========================================
   計算結果
======================================== */

function calculateResult() {


  const highestScore =
    Math.max(
      ...Object.values(scores)
    );


  const winners =
    Object
      .keys(scores)
      .filter(character =>

        scores[character]
        ===
        highestScore

      );



  /*
    同分時：
    從最高分人物中隨機產生一位。
  */

  const index =
    Math.floor(
      Math.random()
      *
      winners.length
    );


  finalCharacter =
    winners[index];


  showResult(
    finalCharacter
  );

}



/* ========================================
   顯示結果圖片
======================================== */

function showResult(character) {


  document
    .getElementById(
      "quizScreen"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "resultScreen"
    )
    .classList
    .remove("hidden");



  const result =
    characters[character];


  const image =
    document
      .getElementById(
        "resultImage"
      );


  const wrapper =
    document
      .getElementById(
        "resultWrapper"
      );


  const actions =
    document
      .getElementById(
        "resultActions"
      );


  const guide =
    document
      .getElementById(
        "shareGuide"
      );


  const errorBox =
    document
      .getElementById(
        "imageError"
      );



  wrapper.classList.remove(
    "hidden"
  );


  actions.classList.remove(
    "hidden"
  );


  guide.classList.remove(
    "hidden"
  );


  errorBox.classList.add(
    "hidden"
  );



  /*
    成功載入圖片
  */

  image.onload =
    function () {


      wrapper.classList.remove(
        "hidden"
      );


      errorBox.classList.add(
        "hidden"
      );


    };



  /*
    圖片不存在
  */

  image.onerror =
    function () {


      wrapper.classList.add(
        "hidden"
      );


      actions.classList.add(
        "hidden"
      );


      guide.classList.add(
        "hidden"
      );


      errorBox.classList.remove(
        "hidden"
      );


      document
        .getElementById(
          "errorCharacter"
        )
        .textContent =
          `${character}｜${result.title}`;

    };



  image.src =
    result.image;


  image.alt =
    `${character}｜${result.title}｜1895文化身份測驗結果`;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/* ========================================
   分享測驗結果
======================================== */

async function shareResult() {


  if (!finalCharacter) {

    showToast(
      "請先完成測驗。"
    );

    return;

  }


  const result =
    characters[finalCharacter];



  /*
    分享文字

    網址也直接寫進文字裡，
    增加不同手機上的相容性。
  */

  const shareText =
    `我的1895文化身份是「${finalCharacter}｜${result.title}」！\n\n你也來測測看：\n${QUIZ_URL}`;



  try {


    /* =====================================
       1. 先複製測驗網址

       之後使用者到 IG
       可以直接貼到「連結貼紙」
    ===================================== */

    await copyTextSilently(
      QUIZ_URL
    );



    /* =====================================
       2. 抓取結果圖片
    ===================================== */

    const response =
      await fetch(
        result.image
      );


    if (!response.ok) {

      throw new Error(
        "結果圖片讀取失敗"
      );

    }



    const blob =
      await response.blob();



    /* =====================================
       3. 建立圖片 File
    ===================================== */

    const file =
      new File(

        [blob],

        `${finalCharacter}-1895文化身份測驗.png`,

        {

          type:
            blob.type
            ||
            "image/png"

        }

      );



    /*
      檢查手機是否支援分享圖片。
    */

    const canShareFile =

      navigator.share
      &&
      navigator.canShare
      &&
      navigator.canShare({

        files: [file]

      });



    /* =====================================
       4A. 可以分享圖片

       → 系統分享選單
       → Instagram / LINE / AirDrop...
    ===================================== */

    if (canShareFile) {


      await navigator.share({

        files:
          [file],

        title:
          "1895文化身份測驗",

        text:
          shareText

      });



      showToast(
        "測驗網址已複製。分享到 IG 限時動態後，可加入「連結」貼紙並直接貼上網址。"
      );


      return;

    }



    /* =====================================
       4B. 不支援分享圖片
       但支援一般系統分享
    ===================================== */

    if (
      navigator.share
    ) {


      await navigator.share({

        title:
          "1895文化身份測驗",

        text:
          shareText,

        url:
          QUIZ_URL

      });



      showToast(
        "測驗網址已複製。分享到 IG 後，可加入「連結」貼紙。"
      );


      return;

    }



    /* =====================================
       4C. 完全不支援 Web Share
    ===================================== */

    showToast(
      "此瀏覽器無法直接開啟系統分享選單。測驗網址已複製，可將結果圖片儲存後分享到 IG。"
    );


  }

  catch (error) {


    /*
      使用者自己取消分享，
      不需要顯示錯誤。
    */

    if (
      error.name
      ===
      "AbortError"
    ) {

      return;

    }


    console.error(
      "分享失敗：",
      error
    );



    /*
      即使圖片分享失敗，
      還是嘗試複製網站網址。
    */

    await copyTextSilently(
      QUIZ_URL
    );


    showToast(
      "圖片分享沒有成功，但測驗網址已複製。可以手動分享到 Instagram 後加入連結貼紙。"
    );

  }

}



/* ========================================
   複製網站網址
======================================== */

async function copyQuizLink() {


  const success =
    await copyTextSilently(
      QUIZ_URL
    );


  if (success) {


    showToast(
      "測驗網址已複製！到 Instagram 限時動態加入「連結」貼紙後直接貼上即可。"
    );


  }

  else {


    /*
      某些舊瀏覽器不支援
      navigator.clipboard
    */


    window.prompt(
      "請複製以下測驗網址：",
      QUIZ_URL
    );


  }

}



/* ========================================
   靜默複製文字
======================================== */

async function copyTextSilently(text) {


  try {


    if (
      navigator.clipboard
      &&
      window.isSecureContext
    ) {


      await navigator
        .clipboard
        .writeText(text);


      return true;

    }



    /*
      舊瀏覽器備用
    */

    const textArea =
      document
        .createElement(
          "textarea"
        );


    textArea.value =
      text;


    textArea.style.position =
      "fixed";


    textArea.style.opacity =
      "0";


    document.body.appendChild(
      textArea
    );


    textArea.focus();


    textArea.select();


    const success =
      document.execCommand(
        "copy"
      );


    document.body.removeChild(
      textArea
    );


    return success;


  }

  catch (error) {


    console.error(
      "複製網址失敗：",
      error
    );


    return false;

  }

}



/* ========================================
   Toast
======================================== */

function showToast(message) {


  const toast =
    document
      .getElementById(
        "toast"
      );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );



  clearTimeout(
    toastTimer
  );



  toastTimer =
    setTimeout(
      function () {


        toast.classList.remove(
          "show"
        );


      },
      4200
    );

}



/* ========================================
   再測一次
======================================== */

function restartQuiz() {


  resetScores();


  currentQuestion = 0;


  finalCharacter = "";



  document
    .getElementById(
      "resultScreen"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "quizScreen"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "startScreen"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "progressBar"
    )
    .style
    .width =
      "0%";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/* ========================================
   第一次開啟
======================================== */

resetScores();


</script>
